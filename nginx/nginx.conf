# Edge reverse proxy: single entrypoint for the whole CRM.
#   /            -> React frontend (static)
#   /api/...     -> FastAPI backend
#   /ws/...      -> Socket.IO (websocket upgrade)
#
# For production TLS with Let's Encrypt:
#   1. Point your domain's DNS at the VPS.
#   2. Run: docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d crm.example.com
#   3. Uncomment the 443 server block below and reload nginx.

upstream backend_api {
    server backend:8000;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /health {
        proxy_pass http://backend_api;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
    }
}

